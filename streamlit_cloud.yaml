name: 多智能体 AI 金融助手
description: >
  基于 Streamlit 的多智能体 AI 金融助手，提供市场简报。
sdk: streamlit
sdk_version: 1.45.0
python_version: 3.9
base_image: python:3.9-slim

# Streamlit Cloud 部署专用配置
build:
  # 复制应用代码前安装依赖
  - pip install -r requirements.txt

# 应用所需的环境变量
env:
  # 通过服务发现访问 FastAPI：http://fastapi:8000
  - name: API_URL
    value: http://fastapi:8000

# 指定需要启动的服务
services:
  - name: fastapi
    command: uvicorn orchestrator.orchestrator:app --host 0.0.0.0 --port 8000
    health_check:
      url: http://localhost:8000
      interval: 10s
      timeout: 5s
      retries: 5

  - name: streamlit
    command: streamlit run streamlit_app/app.py --server.port 8501 --server.address 0.0.0.0
    port: 8501
    depends_on:
      - fastapi